version: '3.8'

services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine  # Usamos una imagen ligera de PostgreSQL 15
    container_name: mikedb_container7
    restart: always
    environment:
      POSTGRES_USER: mike
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: mikedb
    ports:
      - "5433:5432" # Mapea el puerto del contenedor al de su máquina local
    volumes:
      - postgres_data3:/var/lib/postgresql/data  # Persistencia de datos
    networks:
      - clasea_network # Añadido para que la base de datos esté en la misma red

  # Servicio de Almacenamiento MinIO
  minio:
    image: chainguard/minio:latest
    container_name: minio_storage
    user: "65532:65532" # Crítico: Fuerza el usuario 'nonroot' para evitar "access denied" en Windows
    ports:
      - "9000:9000"   # Puerto para la API S3 (comunicación con FastAPI/Boto3)
      - "9001:9001"   # Puerto para la Consola Web de administración
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    volumes:
      - ./minio_data:/data # Bind mount local (evita conflictos de permisos en Windows)
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - clasea_network # Se conecta a la misma red para resolución de nombres DNS interna

# Definición de volúmenes (Corregido: un solo bloque sin duplicaciones)
volumes:
  postgres_data3:
  db_data:
    driver: local

# Definición de redes
networks:
  clasea_network:
    driver: bridge
